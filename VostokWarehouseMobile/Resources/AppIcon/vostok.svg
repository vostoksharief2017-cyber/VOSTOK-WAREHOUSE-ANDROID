<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Navy Blue (#001E3C) to Darker Shade -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0A2A52" />
      <stop offset="100%" stop-color="#001224" />
    </radialGradient>

    <!-- 3D Face Gradient: Deep Navy Blue Branding -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A3670" />
      <stop offset="50%" stop-color="#001E3C" />
      <stop offset="100%" stop-color="#000D1A" />
    </linearGradient>

    <!-- Extrusion / 3D Depth Gradient -->
    <linearGradient id="depthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001428" />
      <stop offset="100%" stop-color="#00070F" />
    </linearGradient>

    <!-- Metallic Gold Edge Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE58F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Layering -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Inner Gloss Overlay -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Android 3D Icon Squircle Base Plate -->
  <g filter="url(#shadow3D)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#goldHighlight)" stroke-width="4" />
  </g>

  <!-- Subtle Inner Glass Reflection Layer -->
  <path d="M 136 32 C 78 32 32 78 32 136 L 32 256 C 180 180 332 180 480 256 L 480 136 C 480 78 434 32 376 32 Z" fill="url(#glassGloss)" pointer-events="none" />

  <!-- 3D Extrusion Offset Layer (Simulating Physical Depth) -->
  <g fill="url(#depthGrad)" transform="translate(0, 10)">
    <text x="256" y="300" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="115" 
          letter-spacing="-1.5"
          text-anchor="middle">vostok</text>
  </g>

  <!-- Secondary Extrusion Highlight for Bevel Effect -->
  <g fill="url(#goldHighlight)" opacity="0.4" transform="translate(0, 4)">
    <text x="256" y="300" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="115" 
          letter-spacing="-1.5"
          text-anchor="middle">vostok</text>
  </g>

  <!-- Main Front Face of Logo -->
  <g fill="url(#faceGrad)" stroke="url(#goldHighlight)" stroke-width="1.5">
    <text x="256" y="300" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="115" 
          letter-spacing="-1.5"
          text-anchor="middle"
          filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.5))">vostok</text>
  </g>
</svg>
